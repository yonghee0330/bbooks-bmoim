<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>《토지》 완독 챌린지 신청 현황 · b.moim</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0a1f44;
      --accent: #4a8cff;
      --text: #1a1a2e;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f4f7fb;
      --white: #fff;
      --cancel: #dc2626;
      --cancel-bg: #fef2f2;
      --ok: #16a34a;
      --ok-bg: #f0fdf4;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: var(--navy);
      padding: 16px 24px;
    }
    .logo {
      font-family: 'Noto Serif KR', serif;
      font-size: 18px;
      font-weight: 700;
      color: white;
      text-decoration: none;
    }
    .logo span { color: var(--accent); }
    .hero {
      background: linear-gradient(160deg, var(--navy) 0%, #1e3a6e 100%);
      color: white;
      text-align: center;
      padding: 36px 20px 32px;
    }
    .hero h1 {
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(20px, 5vw, 26px);
      margin-bottom: 8px;
    }
    .hero p { font-size: 14px; color: rgba(255,255,255,.72); line-height: 1.6; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 56px; }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .status-line { font-size: 13px; color: var(--muted); }
    .btn-refresh {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      color: var(--muted);
    }
    .btn-refresh:disabled { opacity: .55; cursor: default; }
    .alert {
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }
    .alert.error { background: var(--cancel-bg); color: #991b1b; border: 1px solid #fecaca; }
    .alert.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .setup {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 12px;
      color: #92400e;
      line-height: 1.65;
      margin-bottom: 16px;
      display: none;
    }
    .setup.on { display: block; }
    .setup code {
      display: inline-block;
      background: rgba(0,0,0,.06);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
    .result { display: none; }
    .result.on { display: block; }
    .result-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 20px;
      font-weight: 600;
    }
    .result-sub { font-size: 13px; color: var(--muted); margin-top: 4px; margin-bottom: 16px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 12px;
      text-align: center;
    }
    .stat-num {
      font-size: 24px;
      font-weight: 800;
      color: var(--navy);
      line-height: 1;
    }
    .stat-num.cancel { color: var(--cancel); }
    .stat-num.ok { color: var(--ok); }
    .stat-label { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .moim-block {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .moim-block-head {
      background: #f8fafc;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .moim-block-name { font-size: 15px; font-weight: 700; }
    .moim-block-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .session-block { border-bottom: 1px solid var(--border); }
    .session-block:last-child { border-bottom: none; }
    .session-head {
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      background: #f0f6ff;
    }
    .applicant {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13px;
    }
    .applicant:last-child { border-bottom: none; }
    .applicant.cancelled { background: var(--cancel-bg); opacity: .85; }
    .applicant-name { font-weight: 700; }
    .applicant-phone {
      font-variant-numeric: tabular-nums;
      color: var(--navy);
      text-decoration: none;
    }
    a.applicant-phone:hover { text-decoration: underline; }
    .applicant-meta { grid-column: 1 / -1; font-size: 11px; color: var(--muted); }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      align-self: start;
    }
    .badge.cancel { background: #fee2e2; color: #991b1b; }
    .badge.ok { background: #dcfce7; color: #166534; }
    .badge.wait { background: #fef3c7; color: #92400e; }
    .empty {
      padding: 32px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--muted);
    }
    footer a { color: var(--accent); text-decoration: none; }
    @media (max-width: 480px) {
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <a class="logo" href="https://moim.bbooks.co.kr/september.html">b<span>.</span>moim</a>
</header>

<div class="hero">
  <h1>《토지》 완독 챌린지</h1>
  <p>개설자 전용 · 신청자 명단 · 연락처</p>
</div>

<div class="wrap">
  <div class="toolbar">
    <div class="status-line" id="statusLine">불러오는 중…</div>
    <button type="button" class="btn-refresh" id="refreshBtn" onclick="loadStatus()">↻ 새로고침</button>
  </div>

  <div class="setup" id="setupBox">
    <strong>처음 한 번만 설정이 필요합니다.</strong><br>
    구글 시트 「점주코드」 탭에 아래 행을 추가한 뒤 이 페이지를 새로고침하세요.<br><br>
    <code>TOJI2026</code> · <code>비북스</code> · <code>《토지》 완독 챌린지</code> · <code>9월</code><br>
    ※ 모임명은 「모임신청」시트의 모임명과 글자 하나까지 같아야 합니다.
  </div>

  <div id="alertBox"></div>

  <div class="result" id="result">
    <div class="result-title" id="hostTitle"></div>
    <div class="result-sub" id="hostSub"></div>

    <div class="stats">
      <div class="stat">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">전체 신청</div>
      </div>
      <div class="stat">
        <div class="stat-num ok" id="statActive">0</div>
        <div class="stat-label">유효 신청</div>
      </div>
      <div class="stat">
        <div class="stat-num cancel" id="statCancelled">0</div>
        <div class="stat-label">취소</div>
      </div>
    </div>

    <div id="moimList"></div>
  </div>
</div>

<footer>
  <a href="../september.html#tojichallenge">← 9월 모임 페이지</a>
  · <a href="../host.html">점주 코드로 조회</a><br>
  © 2026 · 비북스 b.moim · 이 링크는 개설자 전용입니다
</footer>

<script>
const API = 'https://script.google.com/macros/s/AKfycbx7-YcNCpiwlEsIMBTvWAReULt_bNTZgLV908XNsBqv-bnurJZ5u-6sg32MgQIHWZW6HQ/exec';
const HOST_CODE = 'TOJI2026';
const HOST_MONTH = '9월';

const q = sel => document.querySelector(sel);

function showAlert(msg, type) {
  q('#alertBox').innerHTML = msg
    ? `<div class="alert ${type || 'error'}">${msg}</div>`
    : '';
}

function formatPhoneDisplay(phone) {
  const s = String(phone || '').trim();
  if (!s) return '—';
  if (s.includes('-')) return s;
  const d = s.replace(/\D/g, '');
  if (d.length === 11) return `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`;
  if (d.length === 10) return `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;
  return s;
}

function phoneHref(phone) {
  const d = String(phone || '').replace(/\D/g, '');
  return d ? `tel:${d}` : null;
}

function statusBadge(applicant) {
  if (applicant.cancelled) return '<span class="badge cancel">취소</span>';
  const note = String(applicant.note || '');
  if (note.includes('입금확인')) return '<span class="badge ok">입금확인</span>';
  return '<span class="badge wait">미확인</span>';
}

function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderApplicants(applicants) {
  if (!applicants.length) {
    return '<div class="empty">아직 신청자가 없습니다.</div>';
  }
  return applicants.map(a => {
    const href = phoneHref(a.phone);
    const phoneHtml = href
      ? `<a class="applicant-phone" href="${href}">${formatPhoneDisplay(a.phone)}</a>`
      : `<span class="applicant-phone">${formatPhoneDisplay(a.phone)}</span>`;
    const note = a.note ? `<div class="applicant-meta">비고: ${escapeHtml(a.note)}</div>` : '';
    const applied = a.appliedAt ? `<div class="applicant-meta">신청: ${escapeHtml(a.appliedAt)}</div>` : '';
    const books = a.books ? `<div class="applicant-meta">도서: ${escapeHtml(a.books)}</div>` : '';
    return `<div class="applicant${a.cancelled ? ' cancelled' : ''}">
      <div class="applicant-name">${escapeHtml(a.name || '—')}</div>
      ${statusBadge(a)}
      ${phoneHtml}
      <div class="applicant-meta">${Number(a.amount || 0).toLocaleString()}원</div>
      ${applied}${note}${books}
    </div>`;
  }).join('');
}

function renderResult(data) {
  q('#hostTitle').textContent = data.hostName || '개설자';
  q('#hostSub').textContent = `${data.month} · ${(data.moimNames || []).join(', ')}`;

  const stats = data.stats || {};
  q('#statTotal').textContent = stats.total ?? 0;
  q('#statActive').textContent = stats.active ?? 0;
  q('#statCancelled').textContent = stats.cancelled ?? 0;

  const groups = data.groups || [];
  if (!groups.length) {
    q('#moimList').innerHTML = '<div class="empty">표시할 신청 내역이 없습니다.</div>';
    return;
  }

  q('#moimList').innerHTML = groups.map(g => {
    const sessions = (g.sessions || []).map(s => `
      <div class="session-block">
        <div class="session-head">${escapeHtml(s.session || '회차 미지정')} · ${s.count}명</div>
        ${renderApplicants(s.applicants || [])}
      </div>
    `).join('');
    return `
      <div class="moim-block">
        <div class="moim-block-head">
          <div class="moim-block-name">${escapeHtml(g.moimName)}</div>
          <div class="moim-block-meta">유효 ${g.activeCount}명 / 전체 ${g.totalCount}명</div>
        </div>
        ${sessions}
      </div>`;
  }).join('');
}

async function loadStatus() {
  showAlert('');
  q('#setupBox').classList.remove('on');
  q('#statusLine').textContent = '불러오는 중…';
  const btn = q('#refreshBtn');
  btn.disabled = true;

  try {
    const url = `${API}?action=hostStatus&code=${encodeURIComponent(HOST_CODE)}&month=${encodeURIComponent(HOST_MONTH)}`;
    const res = await fetch(url, { redirect: 'follow' });
    const data = await res.json();

    if (data.error) {
      q('#result').classList.remove('on');
      const needsSetup = /코드가 올바르지 않|점주코드 시트|등록된 모임/.test(data.error);
      if (needsSetup) q('#setupBox').classList.add('on');
      showAlert(escapeHtml(data.error), 'error');
      q('#statusLine').textContent = '조회 실패';
      return;
    }

    renderResult(data);
    q('#result').classList.add('on');
    const active = data.stats?.active ?? 0;
    q('#statusLine').textContent = `유효 신청 ${active}명 · 방금 갱신됨`;
  } catch (e) {
    q('#result').classList.remove('on');
    showAlert('조회 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.', 'error');
    q('#statusLine').textContent = '조회 오류';
    console.warn(e);
  } finally {
    btn.disabled = false;
  }
}

window.addEventListener('DOMContentLoaded', loadStatus);
</script>
</body>
</html>
