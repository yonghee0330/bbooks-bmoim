<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>비모임 신청 현황 · b.moim</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0a1f44;
      --accent: #4a8cff;
      --text: #1a1a2e;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f4f7fb;
      --white: #fff;
      --cancel: #dc2626;
      --cancel-bg: #fef2f2;
      --ok: #16a34a;
      --ok-bg: #f0fdf4;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: var(--navy);
      padding: 16px 24px;
    }
    .logo {
      font-family: 'Noto Serif KR', serif;
      font-size: 18px;
      font-weight: 700;
      color: white;
      text-decoration: none;
    }
    .logo span { color: var(--accent); }
    .hero {
      background: linear-gradient(160deg, var(--navy) 0%, #1e3a6e 100%);
      color: white;
      text-align: center;
      padding: 40px 20px 36px;
    }
    .hero h1 {
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(22px, 5vw, 28px);
      margin-bottom: 8px;
    }
    .hero p { font-size: 14px; color: rgba(255,255,255,.72); line-height: 1.6; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 56px; }
    .search-box {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 4px 24px rgba(10,31,68,.06);
      margin-top: -28px;
      position: relative;
      z-index: 1;
    }
    .search-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 10px;
      letter-spacing: .04em;
    }
    .search-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .search-row input[type="text"] {
      flex: 1 1 180px;
      min-width: 0;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .search-row input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }
    .search-row select {
      padding: 14px 12px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      background: white;
    }
    .btn-go {
      padding: 14px 22px;
      background: var(--navy);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-go:hover { background: #152d5c; }
    .btn-go:disabled { opacity: .55; cursor: default; }
    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
    }
    .alert {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }
    .alert.error { background: var(--cancel-bg); color: #991b1b; border: 1px solid #fecaca; }
    .alert.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .result { display: none; margin-top: 24px; }
    .result.on { display: block; }
    .result-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .result-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 20px;
      font-weight: 600;
    }
    .result-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .btn-refresh {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      color: var(--muted);
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 12px;
      text-align: center;
    }
    .stat-num {
      font-size: 24px;
      font-weight: 800;
      color: var(--navy);
      line-height: 1;
    }
    .stat-num.cancel { color: var(--cancel); }
    .stat-num.ok { color: var(--ok); }
    .stat-label { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .moim-block {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .moim-block-head {
      background: #f8fafc;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .moim-block-name { font-size: 15px; font-weight: 700; }
    .moim-block-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .session-block { border-bottom: 1px solid var(--border); }
    .session-block:last-child { border-bottom: none; }
    .session-head {
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      background: #f0f6ff;
    }
    .applicant {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13px;
    }
    .applicant:last-child { border-bottom: none; }
    .applicant.cancelled { background: var(--cancel-bg); opacity: .85; }
    .applicant-name { font-weight: 700; }
    .applicant-phone {
      font-variant-numeric: tabular-nums;
      color: var(--navy);
      text-decoration: none;
    }
    a.applicant-phone:hover { text-decoration: underline; }
    .applicant-meta { grid-column: 1 / -1; font-size: 11px; color: var(--muted); }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      align-self: start;
    }
    .badge.cancel { background: #fee2e2; color: #991b1b; }
    .badge.ok { background: #dcfce7; color: #166534; }
    .badge.wait { background: #fef3c7; color: #92400e; }
    .empty {
      padding: 32px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--muted);
    }
    footer a { color: var(--accent); text-decoration: none; }
    @media (max-width: 480px) {
      .stats { grid-template-columns: 1fr; }
      .search-row { flex-direction: column; }
      .search-row select, .btn-go { width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <a class="logo" href="https://moim.bbooks.co.kr/june.html">b<span>.</span>moim</a>
</header>

<div class="hero">
  <h1>비모임 신청 현황</h1>
  <p>점주 전용 · 발급받은 코드로<br>내 모임 신청자 명단을 확인합니다</p>
</div>

<div class="wrap">
  <div class="search-box">
    <div class="search-label">점주 코드</div>
    <div class="search-row">
      <input type="text" id="codeInput" placeholder="코드 입력" autocomplete="off" maxlength="32" spellcheck="false">
      <select id="monthSelect" aria-label="월 선택">
        <option value="6월" selected>6월</option>
      </select>
      <button type="button" class="btn-go" id="submitBtn" onclick="loadStatus()">확인</button>
    </div>
    <p class="hint">비북스에서 받은 점주 코드를 입력하세요. 코드는 타인에게 공유하지 마세요.</p>
    <div id="searchAlert"></div>
  </div>

  <div class="result" id="result">
    <div class="result-head">
      <div>
        <div class="result-title" id="hostTitle"></div>
        <div class="result-sub" id="hostSub"></div>
      </div>
      <button type="button" class="btn-refresh" onclick="loadStatus()">↻ 새로고침</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">전체 신청</div>
      </div>
      <div class="stat">
        <div class="stat-num ok" id="statActive">0</div>
        <div class="stat-label">유효 신청</div>
      </div>
      <div class="stat">
        <div class="stat-num cancel" id="statCancelled">0</div>
        <div class="stat-label">취소</div>
      </div>
    </div>

    <div id="moimList"></div>
  </div>
</div>

<footer>
  <a href="september.html">← 9월 모임 페이지</a><br>
  © 2026 · 비북스 b.moim
</footer>

<script>
const API = 'https://script.google.com/macros/s/AKfycbx7-YcNCpiwlEsIMBTvWAReULt_bNTZgLV908XNsBqv-bnurJZ5u-6sg32MgQIHWZW6HQ/exec';
const STORAGE_KEY = 'bmoim_host_code';

const q = sel => document.querySelector(sel);

function showAlert(msg, type) {
  q('#searchAlert').innerHTML = msg
    ? `<div class="alert ${type || 'error'}">${msg}</div>`
    : '';
}

function formatPhoneDisplay(phone) {
  const s = String(phone || '').trim();
  if (!s) return '—';
  if (s.includes('-')) return s;
  const d = s.replace(/\D/g, '');
  if (d.length === 11) return `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`;
  if (d.length === 10) return `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;
  return s;
}

function phoneHref(phone) {
  const d = String(phone || '').replace(/\D/g, '');
  return d ? `tel:${d}` : null;
}

function statusBadge(applicant) {
  if (applicant.cancelled) return '<span class="badge cancel">취소</span>';
  const note = String(applicant.note || '');
  if (note.includes('입금확인')) return '<span class="badge ok">입금확인</span>';
  return '<span class="badge wait">미확인</span>';
}

function renderApplicants(applicants) {
  if (!applicants.length) {
    return '<div class="empty">아직 신청자가 없습니다.</div>';
  }
  return applicants.map(a => {
    const href = phoneHref(a.phone);
    const phoneHtml = href
      ? `<a class="applicant-phone" href="${href}">${formatPhoneDisplay(a.phone)}</a>`
      : `<span class="applicant-phone">${formatPhoneDisplay(a.phone)}</span>`;
    const note = a.note ? `<div class="applicant-meta">비고: ${escapeHtml(a.note)}</div>` : '';
    const applied = a.appliedAt ? `<div class="applicant-meta">신청: ${escapeHtml(a.appliedAt)}</div>` : '';
    return `<div class="applicant${a.cancelled ? ' cancelled' : ''}">
      <div class="applicant-name">${escapeHtml(a.name || '—')}</div>
      ${statusBadge(a)}
      ${phoneHtml}
      <div class="applicant-meta">${Number(a.amount || 0).toLocaleString()}원</div>
      ${applied}${note}
    </div>`;
  }).join('');
}

function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderResult(data) {
  q('#hostTitle').textContent = `${data.hostName} 점주님`;
  q('#hostSub').textContent = `${data.month} · ${data.moimNames.join(', ')}`;

  const stats = data.stats || {};
  q('#statTotal').textContent = stats.total ?? 0;
  q('#statActive').textContent = stats.active ?? 0;
  q('#statCancelled').textContent = stats.cancelled ?? 0;

  const groups = data.groups || [];
  if (!groups.length) {
    q('#moimList').innerHTML = '<div class="empty">표시할 신청 내역이 없습니다.</div>';
    return;
  }

  q('#moimList').innerHTML = groups.map(g => {
    const sessions = (g.sessions || []).map(s => `
      <div class="session-block">
        <div class="session-head">${escapeHtml(s.session || '회차 미지정')} · ${s.count}명</div>
        ${renderApplicants(s.applicants || [])}
      </div>
    `).join('');
    return `
      <div class="moim-block">
        <div class="moim-block-head">
          <div class="moim-block-name">${escapeHtml(g.moimName)}</div>
          <div class="moim-block-meta">유효 ${g.activeCount}명 / 전체 ${g.totalCount}명</div>
        </div>
        ${sessions}
      </div>`;
  }).join('');
}

async function loadStatus() {
  const code = q('#codeInput').value.trim();
  const month = q('#monthSelect').value;
  if (!code) {
    showAlert('점주 코드를 입력해주세요.', 'error');
    return;
  }

  showAlert('');
  const btn = q('#submitBtn');
  btn.disabled = true;
  btn.textContent = '조회 중…';

  try {
    const url = `${API}?action=hostStatus&code=${encodeURIComponent(code)}&month=${encodeURIComponent(month)}`;
    const res = await fetch(url, { redirect: 'follow' });
    const data = await res.json();

    if (data.error) {
      q('#result').classList.remove('on');
      const hint = data.error.includes('unknown action') || data.error.includes('not defined')
        ? '<br><br>관리자 안내: Apps Script에 <code>hostStatus</code> API가 아직 연결되지 않았습니다. <code>apps-script/host-status.gs</code>를 배포해주세요.'
        : '';
      showAlert(escapeHtml(data.error) + hint, 'error');
      return;
    }

    localStorage.setItem(STORAGE_KEY, code);
    renderResult(data);
    q('#result').classList.add('on');
  } catch (e) {
    q('#result').classList.remove('on');
    showAlert('조회 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.', 'error');
    console.warn(e);
  } finally {
    btn.disabled = false;
    btn.textContent = '확인';
  }
}

q('#codeInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadStatus();
});

window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) q('#codeInput').value = saved;
});
</script>
</body>
</html>
